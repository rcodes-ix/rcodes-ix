<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rekik Samson | AI Engineer & UI/UX Designer</title>

    <style>

        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #05030c;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }


        /* =========================
           HERO
        ========================= */

        .hero {
            position: relative;

            min-height: 100vh;
            width: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            background:
                linear-gradient(
                    rgba(5, 3, 15, 0.35),
                    rgba(5, 3, 15, 0.88)
                ),
                url("banner.png") center / cover no-repeat;
        }


        /* Purple glow */

        .hero::before {
            content: "";

            position: absolute;

            width: 550px;
            height: 550px;

            background: #8b3dff;

            opacity: 0.15;

            filter: blur(150px);

            border-radius: 50%;

            top: 10%;
            left: 50%;

            transform: translateX(-50%);
        }


        /* Dark overlay */

        .hero-overlay {
            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    180deg,
                    rgba(4, 2, 12, 0.1),
                    rgba(4, 2, 12, 0.8)
                );
        }


        /* =========================
           CONTENT
        ========================= */

        .hero-content {
            position: relative;

            z-index: 2;

            text-align: center;

            padding: 40px 20px;

            max-width: 1100px;

            width: 100%;
        }


        /* =========================
           WELCOME
        ========================= */

        .hero-greeting {
            margin-bottom: 20px;

            font-size: 13px;

            font-weight: 600;

            letter-spacing: 6px;

            color: #b56cff;

            text-transform: uppercase;
        }


        /* =========================
           NAME
        ========================= */

        .hero-name {
            margin: 0;

            font-size: clamp(4rem, 10vw, 9rem);

            font-weight: 800;

            line-height: 0.95;

            letter-spacing: -5px;

            color: #ffffff;

            text-shadow:
                0 0 20px rgba(157, 78, 255, 0.4),
                0 0 60px rgba(157, 78, 255, 0.2);
        }


        /* =========================
           USERNAME
        ========================= */

        .hero-username {
            margin-top: 22px;

            margin-bottom: 35px;

            font-size: clamp(1rem, 2vw, 1.4rem);

            color: #a970ff;

            letter-spacing: 4px;
        }


        /* =========================
           DIVIDER
        ========================= */

        .hero-divider {
            width: 100px;

            height: 2px;

            margin: 0 auto 40px;

            background: #9b4dff;

            box-shadow:
                0 0 10px #9b4dff,
                0 0 25px rgba(155, 77, 255, 0.6);
        }


        /* =========================
           MAIN FIELD
        ========================= */

        .hero-role {
            min-height: 90px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: clamp(2.2rem, 5vw, 4.5rem);

            font-weight: 700;

            letter-spacing: -1px;

            color: #ffffff;

            text-shadow:
                0 0 10px rgba(170, 100, 255, 0.9),
                0 0 30px rgba(140, 60, 255, 0.5),
                0 0 60px rgba(140, 60, 255, 0.2);
        }


        /* =========================
           TYPING CURSOR
        ========================= */

        .cursor {
            display: inline-block;

            width: 4px;

            height: 1em;

            margin-left: 8px;

            background: #a855f7;

            box-shadow:
                0 0 10px #a855f7,
                0 0 20px #a855f7;

            animation: blink 0.8s infinite;
        }


        @keyframes blink {

            0%,
            45% {
                opacity: 1;
            }

            46%,
            100% {
                opacity: 0;
            }
        }


        /* =========================
           DESCRIPTION
        ========================= */

        .hero-description {
            max-width: 650px;

            margin: 30px auto 0;

            font-size: 1rem;

            line-height: 1.7;

            color: #b8b2c5;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 600px) {

            .hero {
                min-height: 100svh;
            }

            .hero-name {
                letter-spacing: -3px;
            }

            .hero-greeting {
                font-size: 10px;

                letter-spacing: 4px;
            }

            .hero-role {
                min-height: 70px;
            }

        }

    </style>
</head>


<body>


    <!-- =========================
         HERO SECTION
    ========================= -->

    <section class="hero">

        <div class="hero-overlay"></div>


        <div class="hero-content">

            <p class="hero-greeting">
                WELCOME TO MY SPACE
            </p>


            <h1 class="hero-name">
                Rekik Samson
            </h1>


            <p class="hero-username">
                (rcodes-ix)
            </p>


            <div class="hero-divider"></div>


            <!-- Animated field -->

            <div class="hero-role">

                <span id="typing-text"></span>

                <span class="cursor"></span>

            </div>


            <p class="hero-description">
                Building intelligent systems and designing meaningful
                digital experiences.
            </p>

        </div>

    </section>



    <!-- =========================
         TYPING ANIMATION
    ========================= -->

    <script>

        const roles = [
            "AI Engineer",
            "UI/UX Designer"
        ];


        const typingText =
            document.getElementById("typing-text");


        let roleIndex = 0;

        let characterIndex = 0;

        let isDeleting = false;


        function typeEffect() {

            const currentRole =
                roles[roleIndex];


            /* =====================
               TYPING
            ===================== */

            if (!isDeleting) {

                typingText.textContent =
                    currentRole.substring(
                        0,
                        characterIndex + 1
                    );

                characterIndex++;


                /* Finished typing */

                if (
                    characterIndex ===
                    currentRole.length
                ) {

                    isDeleting = true;

                    /* Wait before deleting */

                    setTimeout(
                        typeEffect,
                        1800
                    );

                    return;
                }

            }


            /* =====================
               DELETING
            ===================== */

            else {

                typingText.textContent =
                    currentRole.substring(
                        0,
                        characterIndex - 1
                    );

                characterIndex--;


                /* Finished deleting */

                if (characterIndex === 0) {

                    isDeleting = false;


                    /* Move to next role */

                    roleIndex =
                        (roleIndex + 1)
                        % roles.length;


                    /* Small pause */

                    setTimeout(
                        typeEffect,
                        400
                    );

                    return;
                }

            }


            /* Typing speed */

            const speed =
                isDeleting
                    ? 70
                    : 120;


            setTimeout(
                typeEffect,
                speed
            );

        }


        /* Start animation */

        typeEffect();

    </script>


</body>

</html>
